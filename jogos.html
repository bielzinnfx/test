<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de hoje 🎮</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        Nosso <span>Match</span> ❤️
    </a>

    <button class="header-heart" onclick="mostrarAmor()">
        💌
    </button>

</header>


<main class="page">

    <section class="page-title">

        <div class="page-emoji">
            🎮
        </div>

        <p class="small-text">
            ESCOLHA DE HOJE
        </p>

        <h1>
            O que vamos jogar?
        </h1>

        <p>
            Agora quem manda é você. 😌❤️
        </p>

    </section>


    <section class="choices">

        <button
            class="choice"
            onclick="escolherJogo('Free Fire 🔥')">

            <div class="choice-icon">
                🔥
            </div>

            <div class="choice-text">
                <strong>Free Fire</strong>
                <small>
                    Hoje tem capa? 👀
                </small>
            </div>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            class="choice"
            onclick="escolherJogo('Roblox 🎮')">

            <div class="choice-icon">
                🧱
            </div>

            <div class="choice-text">
                <strong>Roblox</strong>
                <small>
                    Vamos achar alguma coisa aleatória.
                </small>
            </div>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            class="choice"
            onclick="escolherJogo('Minecraft ⛏️')">

            <div class="choice-icon">
                ⛏️
            </div>

            <div class="choice-text">
                <strong>Minecraft</strong>
                <small>
                    Vamos construir nossa casinha? 🥹
                </small>
            </div>

            <span class="arrow">
                ›
            </span>

        </button>


        <button
            class="choice"
            onclick="escolherJogo('Outro jogo 🎁')">

            <div class="choice-icon">
                🎁
            </div>

            <div class="choice-text">
                <strong>Outro jogo</strong>
                <small>
                    Você escolhe, eu acompanho.
                </small>
            </div>

            <span class="arrow">
                ›
            </span>

        </button>

    </section>


    <div id="resultadoJogo" class="result"></div>


    <a href="index.html" class="back-button">
        ← Voltar para o início
    </a>

</main>


<nav class="bottom-nav">

    <a href="index.html" class="nav-item">
        🏠
        <span>Início</span>
    </a>

    <a href="filmes.html" class="nav-item">
        🎬
        <span>Filmes</span>
    </a>

    <a href="jogos.html" class="nav-item active">
        🎮
        <span>Jogos</span>
    </a>

    <a href="contato.html" class="nav-item">
        💌
        <span>Mensagem</span>
    </a>

</nav>


<script src="script.js"></script>

</body>
</html>
