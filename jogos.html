<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo de hoje 🎮</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">🎮 Jogo de hoje</div>

    <nav>
        <a href="index.html">Início</a>
        <a href="filmes.html">Filmes 🎬</a>
        <a href="jogos.html">Jogos 🎮</a>
        <a href="contato.html">Mensagem 💌</a>
    </nav>
</header>

<main class="page">

    <div class="page-title">

        <span>🎮</span>

        <h1>Qual vai ser nossa diversão?</h1>

        <p>
            Escolhe um jogo para hoje. 😌❤️
        </p>

    </div>

    <section class="options">

        <button class="option" onclick="escolherJogo('Free Fire 🔥')">
            <span>🔥</span>
            <strong>Free Fire</strong>
            <small>Hoje tem capa? 👀</small>
        </button>

        <button class="option" onclick="escolherJogo('Roblox 🎮')">
            <span>🧱</span>
            <strong>Roblox</strong>
            <small>Vamos descobrir alguma coisa aleatória.</small>
        </button>

        <button class="option" onclick="escolherJogo('Minecraft ⛏️')">
            <span>⛏️</span>
            <strong>Minecraft</strong>
            <small>Construir nossa casinha? 🥹</small>
        </button>

        <button class="option" onclick="escolherJogo('Outro jogo ❤️')">
            <span>🎁</span>
            <strong>Outro</strong>
            <small>Você escolhe e eu acompanho.</small>
        </button>

    </section>

    <div id="resultadoJogo" class="result"></div>

    <a href="index.html" class="back">← Voltar</a>

</main>

<script src="script.js"></script>

</body>
