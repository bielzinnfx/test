<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filme de hoje 🎬</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">
        Nosso <span>Match</span> ❤️
    </a>

    <button class="header-heart" onclick="mostrarAmor()">💌</button>
</header>

<main class="page">

    <section class="page-title">
        <div class="page-emoji">🎬</div>

        <p class="small-text">ESCOLHA DE HOJE</p>

        <h1>Que filme vamos ver?</h1>

        <p>
            Escolhe o clima de hoje.
            A pipoca fica por nossa conta. 🍿❤️
        </p>
    </section>

    <section class="choices">

        <button class="choice" onclick="escolherFilme('Romance ❤️')">
            <div class="choice-icon">💕</div>

            <div class="choice-text">
                <strong>Romance</strong>
                <small>Para ficar bem juntinhos. 🥰</small>
            </div>

            <span class="arrow">›</span>
        </button>

        <button class="choice" onclick="escolherFilme('Comédia 😂')">
            <div class="choice-icon">😂</div>

            <div class="choice-text">
                <strong>Comédia</strong>
                <small>Hoje é dia de rir de tudo.</small>
            </div>

            <span class="arrow">›</span>
        </button>

        <button class="choice" onclick="escolherFilme('Terror 👻')">
            <div class="choice-icon">👻</div>

            <div class="choice-text">
                <strong>Terror</strong>
                <small>Depois não vale se esconder atrás de mim. 👀</small>
            </div>

            <span class="arrow">›</span>
        </button>

        <button class="choice" onclick="escolherFilme('Surpresa 🎁')">
            <div class="choice-icon">🎁</div>

            <div class="choice-text">
                <strong>Você escolhe</strong>
                <small>Quero descobrir sua escolha.</small>
            </div>

            <span class="arrow">›</span>
        </button>

    </section>

    <div id="resultado" class="result"></div>

    <a href="index.html" class="back-button">
        ← Voltar para o início
    </a>
</main>

<nav class="bottom-nav">
    <a href="index.html" class="nav-item">
        🏠
        <span>Início</span>
    </a>

    <a href="filmes.html" class="nav-item active">
        🎬
        <span>Filmes</span>
    </a>

    <a href="jogos.html" class="nav-item">
        🎮
        <span>Jogos</span>
    </a>

    <a href="contato.html" class="nav-item">
        💌
        <span>Mensagem</span>
    </a>
</nav>

<script src="script.js"></script>
</body>
</html>
