<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Match ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="entry-body">

    <div class="floating-hearts">
        <span>❤️</span>
        <span>💕</span>
        <span>✨</span>
        <span>💗</span>
        <span>♡</span>
    </div>

    <main class="entry-card">

        <div class="big-heart">❤️</div>

        <p class="mini-title">UMA PEQUENA SURPRESA</p>

        <h1>Nosso Match</h1>

        <p class="entry-text">
            Antes de entrar nesse cantinho,
            preciso descobrir quem está chegando... 👀
        </p>

        <div class="question">
            Você é a pessoa mais especial daqui? 🥹
        </div>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome ❤️"
            autocomplete="off"
        >

        <div class="entry-buttons">

            <button class="main-btn" onclick="entrar()">
                SIM 😍
            </button>

            <button
                class="no-btn"
                id="nao"
                onmouseover="fugir()"
                onclick="fugir()">
                NÃO 😏
            </button>

        </div>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
