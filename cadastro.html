<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma surpresa ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="center-page">

    <div class="hearts"></div>

    <main class="card entrance">
        <div class="heart">❤️</div>

        <h1>Antes de entrar...</h1>

        <p>Preciso confirmar uma coisinha importante.</p>

        <h2>Você é a garota mais incrível desse site? 👀</h2>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome ❤️"
        >

        <div class="buttons">
            <button onclick="entrar()">SIM 😍</button>
            <button id="nao" onmouseover="fugir()">NÃO 😏</button>
        </div>

        <p id="mensagem"></p>
    </main>

    <script src="script.js"></script>

</body>
</html>
